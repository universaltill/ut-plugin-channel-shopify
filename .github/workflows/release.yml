name: Release

# Package and publish this plugin to the marketplace. CI orchestrates the
# same repo scripts used locally (scripts/package.sh, scripts/publish.sh,
# scripts/approve.sh); no release logic lives in YAML.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, alpha]
        default: stable
      publish:
        description: "Upload to the marketplace (untick for a dry-run package)"
        type: boolean
        default: true

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build WASI module
        run: scripts/build.sh

      - name: Validate manifest
        run: scripts/validate.sh

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "ERROR: tag v${tag} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Package release artifact
        run: scripts/package.sh

      - name: Create GitHub Release (unsigned bundle — not for production till import; use the Marketplace)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(python3 -c "import json;print(json.load(open('manifest.json'))['id'])")
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          artifact="dist/${id}_${version}_universal.tar.gz"
          [ -f "$artifact" ] || { echo "ERROR: expected artifact not found: $artifact" >&2; ls -la dist/ >&2; exit 1; }
          cp "$artifact" dist/latest.tar.gz
          # Regenerate the checksum against the renamed file — a straight
          # `cp` of the versioned artifact's .sha256 keeps the OLD filename
          # inside the file, so `sha256sum -c latest.tar.gz.sha256` fails
          # for self-hosters who download both from releases/latest/*
          # (ut-docs#166).
          (cd dist && sha256sum latest.tar.gz > latest.tar.gz.sha256)
          gh release create "${GITHUB_REF_NAME}" \
            "$artifact" "${artifact}.sha256" dist/latest.tar.gz dist/latest.tar.gz.sha256 \
            --title "${id} ${version}" \
            --notes "Unsigned plugin bundle built from tag ${GITHUB_REF_NAME} — not installable on a production till; released to the Universal Till Marketplace for install once approved. releases/latest/download/latest.tar.gz always points at whichever GitHub Release is newest (reference only)."

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: release-universal
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish to marketplace
        if: github.event_name == 'push' || inputs.publish
        env:
          MARKETPLACE_BASE_URL: ${{ secrets.MARKETPLACE_BASE_URL }}
          MARKETPLACE_UPLOAD_TOKEN: ${{ secrets.MARKETPLACE_UPLOAD_TOKEN }}
          MARKETPLACE_LISTING_ID: ${{ vars.MARKETPLACE_LISTING_ID }}
          MARKETPLACE_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: scripts/publish.sh

      # Dev-marketplace convenience: the pipeline is trusted end-to-end, so the
      # release is auto-approved (review-assign + approve, which signs it).
      # Unset the AUTO_APPROVE repo variable to fall back to human review.
      - name: Auto-approve on the dev marketplace
        if: (github.event_name == 'push' || inputs.publish) && vars.AUTO_APPROVE == 'true'
        env:
          MARKETPLACE_BASE_URL: ${{ secrets.MARKETPLACE_BASE_URL }}
          # ut-cloud's authorizeStaff has honored a distinct
          # MARKETPLACE_ADMIN_TOKEN server-side since ut-docs#496 (used
          # EXCLUSIVELY once configured, no fallback to the upload token
          # server-side). This repo secret is not provisioned yet, which
          # is an ops action, not a code gap — until it is set,
          # scripts/approve.sh falls back to MARKETPLACE_UPLOAD_TOKEN
          # client-side, no behavior change.
          MARKETPLACE_ADMIN_TOKEN: ${{ secrets.MARKETPLACE_ADMIN_TOKEN }}
          MARKETPLACE_UPLOAD_TOKEN: ${{ secrets.MARKETPLACE_UPLOAD_TOKEN }}
        run: scripts/approve.sh
